<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7ed">
  <meta name="description" content="一個人也可以好好過生日。把今天，完整地還給自己。">
  <title>一個人也可以好好過生日</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f8f1e6'/%3E%3Cpath d='M11 36h42v16H11z' fill='%23a66d59'/%3E%3Cpath d='M9 32q7-8 14 0 7-8 14 0 7-8 18 0v8H9z' fill='%23f6d8bf'/%3E%3Cpath d='M30 19h4v12h-4z' fill='%23b88455'/%3E%3Cpath d='M32 8q9 9 0 13-9-4 0-13' fill='%23eab85e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js?v=20261008-home-copy2" defer></script>
  <style>
    /* Homepage-only refinements; later stages continue to use styles.css. */
    #app .welcome-panel .opening-mark {
      position: relative;
      z-index: 1;
      font-size: clamp(6.75rem, 29vw, 7.7rem);
      line-height: 1.05;
      margin: 2px auto 12px;
      pointer-events: none;
    }
    #app .welcome-panel .welcome-copy {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: clamp(7.2rem, 20vw, 8.8rem);
      margin: 0 auto 10px;
    }
    #app .welcome-panel .welcome-copy > * {
      grid-area: 1 / 1;
      width: 100%;
      min-height: 0;
      margin: 0;
    }
    #app .welcome-panel .welcome-next { font-size: clamp(1.25rem, 5.6vw, 2rem); }
    #app .welcome-panel .welcome-line { display: block; white-space: nowrap; }
    #app .welcome-panel .welcome-sparkles { pointer-events: none !important; }
    #app .welcome-panel > button[data-action="start"] {
      position: relative;
      z-index: 5;
      pointer-events: auto !important;
      touch-action: manipulation;
    }
    @media (max-height: 680px) {
      #app .welcome-panel .opening-mark { font-size: 6.75rem; margin-bottom: 6px; }
    }
  </style>
  <script>
    /* Optional display font: never hold up the homepage if the font network is slow. */
    (() => {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=Huninn&display=swap';
      link.media = 'print';
      link.onload = () => { link.media = 'all'; };
      document.head.appendChild(link);
    })();
  </script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div><div class="ambient ambient-two" aria-hidden="true"></div>
  <main id="app" class="shell" aria-live="polite">
    <section class="panel intro welcome-panel">
      <div class="welcome-sparkles" aria-hidden="true"><i>✦</i><i>✿</i><i>✧</i><i>✿</i><i>✦</i><i>✧</i></div>
      <div class="eyebrow">一個人也可以好好過生日</div>
      <div class="opening-mark" aria-hidden="true">🎁</div>
      <div class="welcome-copy">
        <p class="welcome-first"><span class="welcome-line">今天</span><span class="welcome-line">有一份驚喜</span><span class="welcome-line">只留給你</span></p>
        <h1 class="welcome-next"><span class="welcome-line">在生日開始之前，</span><span class="welcome-line">讓我們先認識你一點。</span></h1>
      </div>
      <p class="lead">今天的故事，從你開始。</p>
      <button class="primary" type="button" data-action="start">☀️ 開始我的生日</button>
    </section>
  </main>
  <button id="music-toggle" class="music-toggle" type="button" aria-label="開啟音樂" aria-pressed="false">♫ 音樂關</button>
  <audio id="birthday-music" loop preload="none"></audio>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <script>
    (() => {
      const app = document.getElementById('app');
      function refineHomepage() {
        const panel = app.querySelector('.welcome-panel');
        if (!panel) return;
        const first = panel.querySelector('.welcome-first');
        const title = panel.querySelector('.welcome-next');
        if (first && !first.querySelector('.welcome-line')) {
          first.innerHTML = '<span class="welcome-line">今天</span><span class="welcome-line">有一份驚喜</span><span class="welcome-line">只留給你</span>';
        }
        if (title && !title.querySelector('.welcome-line')) {
          title.innerHTML = '<span class="welcome-line">在生日開始之前，</span><span class="welcome-line">讓我們先認識你一點。</span>';
        }
        if (first && title && !panel.querySelector('.welcome-copy')) {
          const copy = document.createElement('div');
          copy.className = 'welcome-copy';
          first.before(copy);
          copy.append(first, title);
        }
        const button = panel.querySelector('button[data-action="start"]');
        if (!button || button.dataset.safariTouchReady) return;
        button.dataset.safariTouchReady = 'true';
        let touchActivated = false;
        button.addEventListener('touchend', event => {
          if (event.cancelable) event.preventDefault();
          if (touchActivated) return;
          touchActivated = true;
          button.click(); // One click, through app.js's existing delegated handler.
          setTimeout(() => { touchActivated = false; }, 700);
        }, {passive: false});
        button.addEventListener('click', event => {
          // Some Safari versions may emit a compatibility click after touchend.
          if (touchActivated && event.isTrusted) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      }
      new MutationObserver(refineHomepage).observe(app, {childList: true});
      refineHomepage();
    })();
  </script>
  <script>
    (() => {
      const app = document.getElementById('app');
      function addReplayButton() {
        const card = app.querySelector('.card-panel');
        if (!card || card.querySelector('[data-action="restart"], [data-home-replay]')) return;
        const actions = card.querySelector('.actions');
        if (!actions) return;
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'secondary';
        button.dataset.homeReplay = '';
        button.textContent = '回到首頁・重新試玩';
        actions.appendChild(button);
      }
      new MutationObserver(addReplayButton).observe(app, {childList: true, subtree: true});
      addReplayButton();
      app.addEventListener('click', event => {
        if (!event.target.closest('[data-home-replay]')) return;
        if (!confirm('重新開始會清除這台裝置本次的回答與進度。要回到首頁嗎？')) return;
        try { localStorage.removeItem('caicai-birthday-v1'); } catch (_) {}
        location.reload();
      });
    })();
  </script>
</body>
</html>
